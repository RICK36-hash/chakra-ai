<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHAKRA AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="logo">🔮 CHAKRA</h1>
      <button class="new-chat-btn" id="newChatBtn" title="New Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Chat
      </button>
    </div>
    <div class="sidebar-conversations" id="conversationList">
      <!-- Conversations will be rendered here by JS -->
    </div>
    <div class="sidebar-footer">
      <button class="clear-all-btn" id="clearAllBtn" title="Delete all conversations">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-2 14H7L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4h6v2"></path>
        </svg>
        Clear All
      </button>
    </div>
  </aside>

  <!-- Mobile sidebar toggle -->
  <button class="sidebar-toggle" id="sidebarToggle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Main Chat Area -->
  <main class="chat-main">
    <!-- Chat Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">🔮</div>
        <h2>Welcome to CHAKRA AI</h2>
        <p>Powered by Google Gemini. Ask me anything.</p>
        <div class="suggestion-chips">
          <button class="chip" data-prompt="Explain quantum computing in simple terms">💡 Explain quantum computing</button>
          <button class="chip" data-prompt="Write a Python function to sort a list">🐍 Write a Python sort function</button>
          <button class="chip" data-prompt="What are the best practices for web development?">🌐 Web dev best practices</button>
          <button class="chip" data-prompt="Tell me a creative short story">📖 Tell me a story</button>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-container">
      <form class="chat-input-form" id="chatForm">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            placeholder="Message CHAKRA..."
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn" disabled title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </button>
        </div>
      </form>
      <p class="disclaimer">CHAKRA can make mistakes. Verify important information.</p>
    </div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
